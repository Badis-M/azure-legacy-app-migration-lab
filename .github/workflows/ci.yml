name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        working-directory: infra/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Validate Docker build
        run: docker build -t customer-orders-api:ci ./containerized-app

      - name: Validate AKS-compatible Docker build
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t customer-orders-api:ci-amd64 \
            ./containerized-app \
            --load

      - name: Render local Kubernetes manifests
        run: kubectl kustomize k8s/overlays/local/ > /tmp/rendered-local-manifests.yaml

      - name: Render Azure Kubernetes manifests
        run: kubectl kustomize k8s/overlays/azure/ > /tmp/rendered-azure-manifests.yaml

      - name: Show rendered local Kubernetes manifests
        run: cat /tmp/rendered-local-manifests.yaml

      - name: Show rendered Azure Kubernetes manifests
        run: cat /tmp/rendered-azure-manifests.yaml

      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint

      - name: Lint YAML files
        run: yamllint .