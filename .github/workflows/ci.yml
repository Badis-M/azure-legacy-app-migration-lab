name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Docker build
        run: docker build -t customer-orders-api:ci ./containerized-app
      - name: Validate Kubernetes manifests with Kustomize
        run: kubectl kustomize k8s/overlays/local/ > /tmp/rendered-manifests.yaml
      - name: Show rendered Kubernetes manifests
        run: cat /tmp/rendered-manifests.yaml
      - name: Install yamllint
        run: |
          python -m pip install --upgrade pip
          pip install yamllint
      - name: Lint YAML files
        run: yamllint .
