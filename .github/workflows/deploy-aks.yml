name: Manual AKS Deployment

on:
  workflow_dispatch:
    inputs:
      apply_infra:
        description: "Run Terraform apply before deployment"
        required: true
        type: boolean
        default: false
      destroy_after:
        description: "Destroy Terraform-managed resources after validation"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_DIR: infra/terraform
  APP_DIR: containerized-app
  K8S_AZURE_OVERLAY: k8s/overlays/azure
  IMAGE_NAME: customer-orders-api
  IMAGE_TAG: dev

  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  TF_VAR_owner: badis
  TF_VAR_acr_name: ${{ vars.ACR_NAME }}

jobs:
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform apply
        if: ${{ inputs.apply_infra }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve

      - name: Read Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "aks_name=$(terraform output -raw aks_name)" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.tf_outputs.outputs.resource_group_name }}" \
            --name "${{ steps.tf_outputs.outputs.aks_name }}" \
            --overwrite-existing

      - name: Verify AKS context
        run: |
          kubectl config current-context
          kubectl get nodes -o wide

      - name: Azure Container Registry login
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push AKS-compatible image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -t "${{ steps.tf_outputs.outputs.acr_login_server }}/${IMAGE_NAME}:${IMAGE_TAG}" \
            "./${APP_DIR}" \
            --push

      - name: Render Azure Kubernetes manifests
        run: kubectl kustomize "${K8S_AZURE_OVERLAY}"

      - name: Apply Azure Kubernetes manifests
        run: kubectl apply -k "${K8S_AZURE_OVERLAY}"

      - name: Wait for PostgreSQL rollout
        run: |
          kubectl rollout status statefulset/postgres \
            -n customer-orders \
            --timeout=180s

      - name: Wait for API rollout
        run: |
          kubectl rollout status deployment/customer-orders-api \
            -n customer-orders \
            --timeout=180s

      - name: Show Kubernetes status
        run: |
          kubectl get pods -n customer-orders -o wide
          kubectl get svc -n customer-orders
          kubectl get pvc -n customer-orders

      - name: Destroy Terraform-managed resources
        if: ${{ inputs.destroy_after }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform destroy -auto-approve
